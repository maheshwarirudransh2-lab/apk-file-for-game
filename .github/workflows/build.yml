name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev python3-venv python3-pip
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel cython buildozer
          pip install --break-system-packages --upgrade cython buildozer
          .venv/bin/cython --version

      - name: Build APK with Buildozer
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sliding-puzzle-apk
          path: bin/*.apk
